<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Not Found | Lumo OS</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f8fafc; margin: 0; color: #334155; }
        .container { text-align: center; max-width: 500px; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { font-size: 4rem; margin: 0 0 10px 0; color: #94a3b8; }
        h2 { margin: 0 0 20px 0; color: #0f172a; }
        p { margin-bottom: 30px; line-height: 1.6; }
        a { background-color: #2563eb; color: white; text-decoration: none; padding: 10px 24px; border-radius: 6px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Website Not Found</h2>
        <p>The domain you are trying to access is not connected to any active workspace in Lumo OS.</p>
        <a href="/">Go to Homepage</a>
    </div>
</body>
</html>
