{% load form_tags %}
<div class="mb-3">
    <label class="form-label fw-medium small text-dark">{{ label }} {% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label>
    
    {% if field.errors %}
        {{ field|add_class:"form-select select2-custom is-invalid" }}
        <div class="invalid-feedback fw-medium d-block">
            {{ field.errors.0 }}
        </div>
    {% else %}
        {{ field|add_class:"form-select select2-custom" }}
    {% endif %}
    
    {% if field.help_text %}
        <div class="form-text small text-muted">{{ field.help_text }}</div>
    {% endif %}
</div>
